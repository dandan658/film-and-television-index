name: Test and publish NAS image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: film-index-publish
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      IMAGE: ghcr.io/dandan658/film-and-television-index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Test retained functionality guards
        run: |
          python3 -m pip install Flask==2.1.2 Werkzeug==2.1.2
          python3 -m unittest discover -s tests -p test_media_profile.py -v
          python3 -m unittest discover -s tests -p test_directory_listing.py -v
          node scripts/check_navigation.cjs
          node --check web/static/js/liquid-glass.js
          node --check web/static/js/glass-picker.js
      - name: Build pinned amd64 runtime
        run: |
          docker build --platform linux/amd64 --label org.opencontainers.image.source=https://github.com/${{ github.repository }} --label org.opencontainers.image.revision=${{ github.sha }} -t film-index:test .
      - name: Test real container startup and login
        run: bash scripts/smoke-test.sh film-index:test
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image
        run: |
          set -euo pipefail
          for tag in latest 1.2.0 sha-${GITHUB_SHA:0:12}; do
            docker tag film-index:test "$IMAGE:$tag"
            docker push "$IMAGE:$tag"
          done
